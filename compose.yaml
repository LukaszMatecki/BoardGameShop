services:
  database:
    image: postgres:17-alpine
    container_name: projekt-skle-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projektskle
      POSTGRES_USER: projektskle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: